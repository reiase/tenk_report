<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">从物理故障到 ECC 处置的传播链</title>
  <desc id="desc">瞬态、间歇和永久故障作用于存储阵列或数据路径，经 ECC 解码后分为无异常、可纠正错误和不可纠正错误；系统据空间位置、时间聚集和重复性采取观察、修复或隔离措施，ECC 覆盖域外的错误仍可能成为静默数据损坏。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#46728f"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 27px; font-weight: 700; }
      .box { fill: #fff; stroke: #88a5b5; stroke-width: 2; rx: 12; }
      .source { fill: #eef3f7; stroke: #6f8fa2; }
      .ecc { fill: #e5f5f5; stroke: #087f8c; }
      .warn { fill: #fff5e8; stroke: #b87825; }
      .fail { fill: #fbeeee; stroke: #a95454; }
      .label { font-size: 16px; font-weight: 650; }
      .minor { font-size: 14px; fill: #587080; }
      .line { fill: none; stroke: #46728f; stroke-width: 2.3; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
      .note { font-size: 13px; fill: #6b4f2b; }
    </style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="54" y="55">从物理故障到 ECC 事件：检测结果不是根因</text>

  <g transform="translate(45 105)"><rect class="box source" width="235" height="105"/><text class="label" x="117" y="30" text-anchor="middle">瞬态扰动</text><text class="minor" x="117" y="57" text-anchor="middle">粒子辐射 · 电源噪声</text><text class="minor" x="117" y="80" text-anchor="middle">电荷泄漏 · 邻位扰动</text></g>
  <g transform="translate(45 255)"><rect class="box source" width="235" height="105"/><text class="label" x="117" y="30" text-anchor="middle">间歇性边缘状态</text><text class="minor" x="117" y="57" text-anchor="middle">温度 · 电压 · 负载相关</text><text class="minor" x="117" y="80" text-anchor="middle">时序或信号完整性裕量</text></g>
  <g transform="translate(45 405)"><rect class="box source" width="235" height="105"/><text class="label" x="117" y="30" text-anchor="middle">永久性缺陷与老化</text><text class="minor" x="117" y="57" text-anchor="middle">cell · row/column · TSV</text><text class="minor" x="117" y="80" text-anchor="middle">互连 · 封装 · 电迁移</text></g>

  <rect class="box" x="350" y="210" width="235" height="190"/>
  <text class="label" x="467" y="247" text-anchor="middle">故障被激活</text>
  <text class="minor" x="467" y="278" text-anchor="middle">存储阵列</text><text class="minor" x="467" y="303" text-anchor="middle">缓存与寄存器</text><text class="minor" x="467" y="328" text-anchor="middle">命令 / 地址 / 数据路径</text><text class="minor" x="467" y="353" text-anchor="middle">读出值与写入值不一致</text>
  <path class="line" d="M280 157 H315 V255 H349"/><path class="line" d="M280 307 H349"/><path class="line" d="M280 457 H315 V355 H349"/>

  <rect class="box ecc" x="650" y="210" width="220" height="190"/>
  <text class="label" x="760" y="247" text-anchor="middle">ECC 解码</text>
  <text class="minor" x="760" y="280" text-anchor="middle">数据位 + 校验位</text><text class="minor" x="760" y="306" text-anchor="middle">计算 syndrome</text><text class="minor" x="760" y="332" text-anchor="middle">判断是否超出纠错能力</text><text class="minor" x="760" y="365" text-anchor="middle">SEC-DED 只是常见基线</text>
  <path class="line" d="M585 305 H649"/>

  <rect class="box ecc" x="935" y="95" width="220" height="105"/>
  <text class="label" x="1045" y="128" text-anchor="middle">可纠正错误 · CE</text><text class="minor" x="1045" y="155" text-anchor="middle">修正数据并累计事件</text><text class="minor" x="1045" y="178" text-anchor="middle">继续运行，但观察趋势</text>
  <rect class="box fail" x="935" y="255" width="220" height="105"/>
  <text class="label" x="1045" y="288" text-anchor="middle">不可纠正错误 · UE</text><text class="minor" x="1045" y="315" text-anchor="middle">检测到但无法恢复原值</text><text class="minor" x="1045" y="338" text-anchor="middle">阻断、隔离或修复</text>
  <rect class="box warn" x="935" y="415" width="220" height="105"/>
  <text class="label" x="1045" y="448" text-anchor="middle">未覆盖或误纠正</text><text class="minor" x="1045" y="475" text-anchor="middle">可能表现为 SDC</text><text class="minor" x="1045" y="498" text-anchor="middle">依赖端到端正确性检查</text>
  <path class="line" d="M870 255 L934 166"/><path class="line" d="M870 305 H934"/><path class="line dash" d="M870 355 L934 448"/>

  <rect x="350" y="550" width="805" height="48" rx="9" fill="#eaf0f4"/>
  <text class="minor" x="752" y="579" text-anchor="middle">处置依据 = 是否可纠正 × 是否重复 × 空间位置 × 时间聚集 × 是否已污染作业，而不是只看累计计数。</text>
</svg>
