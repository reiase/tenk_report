<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">A3 通信组拓扑放置决策</title>
  <desc id="desc">训练配置经通信组解析和健康过滤后判断能否放入单个逻辑超节点；单域采用紧凑放置，跨域选择网络一致的多个超节点并均衡节点与网卡负载，最后生成并验证通信拓扑。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#46728f"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 27px; font-weight: 700; }
      .box { fill: #fff; stroke: #89a5b5; stroke-width: 2; rx: 12; }
      .accent { fill: #e5f5f5; stroke: #087f8c; }
      .decision { fill: #eef4f8; stroke: #3d708d; stroke-width: 2.2; }
      .label { font-size: 16px; font-weight: 650; }
      .minor { font-size: 14px; fill: #5a7180; }
      .line { fill: none; stroke: #46728f; stroke-width: 2.3; marker-end: url(#arrow); }
      .edge { font-size: 14px; font-weight: 650; fill: #087f8c; }
    </style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="54" y="55">通信组的拓扑感知放置决策</text>
  <g transform="translate(55 120)"><rect class="box" width="205" height="78"/><text class="label" x="102" y="34" text-anchor="middle">训练作业与并行配置</text><text class="minor" x="102" y="59" text-anchor="middle">TP · PP · DP · EP</text></g>
  <g transform="translate(305 120)"><rect class="box" width="205" height="78"/><text class="label" x="102" y="34" text-anchor="middle">解析通信组</text><text class="minor" x="102" y="59" text-anchor="middle">频率 · 消息 · 参与 rank</text></g>
  <g transform="translate(535 120)"><rect class="box" width="220" height="78"/><text class="label" x="110" y="34" text-anchor="middle">健康资源过滤</text><text class="minor" x="110" y="59" text-anchor="middle">异常卡 · 节点 · 链路</text></g>
  <path class="line" d="M260 159 H304"/><path class="line" d="M510 159 H534"/>

  <polygon class="decision" points="930,100 1085,159 930,218 775,159"/>
  <text class="label" x="930" y="151" text-anchor="middle">通信组可否放入</text><text class="label" x="930" y="176" text-anchor="middle">一个逻辑超节点？</text>
  <path class="line" d="M755 159 H774"/>

  <g transform="translate(715 285)"><rect class="box accent" width="230" height="82"/><text class="label" x="115" y="36" text-anchor="middle">超节点内紧凑放置</text><text class="minor" x="115" y="62" text-anchor="middle">保持高频通信局部性</text></g>
  <path class="line" d="M895 215 L850 284"/><text class="edge" x="842" y="245">能</text>

  <g transform="translate(970 285)"><rect class="box" width="190" height="82"/><text class="label" x="95" y="35" text-anchor="middle">选择 K 个超节点</text><text class="minor" x="95" y="61" text-anchor="middle">网络条件一致</text></g>
  <path class="line" d="M985 213 L1050 284"/><text class="edge" x="1023" y="244">不能</text>
  <g transform="translate(970 420)"><rect class="box" width="190" height="90"/><text class="label" x="95" y="34" text-anchor="middle">跨域负载均衡</text><text class="minor" x="95" y="60" text-anchor="middle">节点数 · rank 数</text><text class="minor" x="95" y="80" text-anchor="middle">出口网卡带宽</text></g>
  <path class="line" d="M1065 367 V419"/>

  <g transform="translate(535 426)"><rect class="box" width="290" height="84"/><text class="label" x="145" y="35" text-anchor="middle">按物理超节点分组</text><text class="minor" x="145" y="61" text-anchor="middle">逻辑域内 rank 连续</text></g>
  <path class="line" d="M830 367 V405 H680 V425"/><path class="line" d="M970 465 H826"/>
  <g transform="translate(165 426)"><rect class="box accent" width="300" height="84"/><text class="label" x="150" y="35" text-anchor="middle">拓扑校验与 HCCL 基准</text><text class="minor" x="150" y="61" text-anchor="middle">正确性 · 带宽 · 尾延迟</text></g>
  <path class="line" d="M535 468 H466"/>
  <rect x="165" y="565" width="995" height="40" rx="8" fill="#eef3f7"/>
  <text class="minor" x="662" y="590" text-anchor="middle">决策原则：先保证通信局部性；必须跨域时，再按可用出口带宽进行对称或加权放置。</text>
</svg>
