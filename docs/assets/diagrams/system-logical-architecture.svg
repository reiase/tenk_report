<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">训练系统逻辑架构</title>
  <desc id="desc">统一控制面经过健康检查管理 A3 和 C550 两个独立资源池，两条 Megatron 训练路径分别扩容并输出训练产物，同时接入统一指标和故障闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46728f"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .minor { font-size: 15px; fill: #52697a; }
      .box { fill: #ffffff; stroke: #9ab2c2; stroke-width: 2; rx: 12; }
      .control { fill: #102f49; stroke: #102f49; }
      .control-text { fill: #ffffff; }
      .a3 { fill: #e8f5f7; stroke: #087f8c; }
      .c550 { fill: #edf2fa; stroke: #3c6793; }
      .shared { fill: #f1f5f8; stroke: #718b9d; }
      .line { fill: none; stroke: #46728f; stroke-width: 2.4; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7b92a1; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="720" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="60" y="58">训练系统逻辑架构</text>

  <rect class="control" x="300" y="88" width="600" height="82" rx="14"/>
  <text class="label control-text" x="600" y="120" text-anchor="middle">统一控制面</text>
  <text class="minor control-text" x="600" y="146" text-anchor="middle">资产 · 调度 · 镜像 · 实验 · 指标</text>

  <rect class="box shared" x="455" y="205" width="290" height="72"/>
  <text class="label" x="600" y="248" text-anchor="middle">设备筛查与健康检查</text>
  <path class="line" d="M600 170 V204"/>

  <rect class="box shared" x="55" y="318" width="220" height="74"/>
  <text class="label" x="165" y="350" text-anchor="middle">训练数据与存储</text>
  <text class="minor" x="165" y="375" text-anchor="middle">公共输入，路径独立</text>

  <rect class="box a3" x="345" y="312" width="230" height="90"/>
  <text class="label" x="460" y="347" text-anchor="middle">A3 资源池</text>
  <text class="minor" x="460" y="375" text-anchor="middle">8,192 张</text>
  <rect class="box c550" x="625" y="312" width="230" height="90"/>
  <text class="label" x="740" y="347" text-anchor="middle">C550 资源池</text>
  <text class="minor" x="740" y="375" text-anchor="middle">2,048 张</text>
  <path class="line" d="M530 277 V312"/>
  <path class="line" d="M670 277 V312"/>
  <path class="line" d="M275 344 H344"/>
  <path class="line" d="M275 370 H624"/>

  <rect class="box a3" x="345" y="448" width="230" height="78"/>
  <text class="label" x="460" y="480" text-anchor="middle">Megatron · A3</text>
  <text class="minor" x="460" y="505" text-anchor="middle">适配与调优</text>
  <rect class="box c550" x="625" y="448" width="230" height="78"/>
  <text class="label" x="740" y="480" text-anchor="middle">Megatron · C550</text>
  <text class="minor" x="740" y="505" text-anchor="middle">适配与调优</text>
  <path class="line" d="M460 402 V447"/>
  <path class="line" d="M740 402 V447"/>

  <rect class="box a3" x="345" y="570" width="230" height="76"/>
  <text class="label" x="460" y="602" text-anchor="middle">A3 分级扩容</text>
  <text class="minor" x="460" y="627" text-anchor="middle">扩展效率曲线</text>
  <rect class="box c550" x="625" y="570" width="230" height="76"/>
  <text class="label" x="740" y="602" text-anchor="middle">C550 分级扩容</text>
  <text class="minor" x="740" y="627" text-anchor="middle">扩展效率曲线</text>
  <path class="line" d="M460 526 V569"/>
  <path class="line" d="M740 526 V569"/>

  <rect class="box shared" x="920" y="330" width="225" height="96"/>
  <text class="label" x="1032" y="365" text-anchor="middle">统一可观测性</text>
  <text class="minor" x="1032" y="392" text-anchor="middle">指标 · 日志</text>
  <text class="minor" x="1032" y="414" text-anchor="middle">故障闭环</text>
  <path class="dash" d="M855 347 H919"/>
  <path class="dash" d="M855 385 H919"/>

  <rect class="box shared" x="910" y="556" width="245" height="90"/>
  <text class="label" x="1032" y="592" text-anchor="middle">训练产物</text>
  <text class="minor" x="1032" y="619" text-anchor="middle">检查点 · 模型 · 实验记录</text>
  <path class="line" d="M575 608 H595 V675 H1032 V647"/>
  <path class="line" d="M855 608 H909"/>
</svg>
