<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">A3 互连层级</title>
  <desc id="desc">单个 A3 计算节点内以 HiAM 和 HCCS-L1 互连，多个计算节点通过 HCCS-L2 构成逻辑超节点，不同超节点域之间使用 Device 网卡和 RoCE 通信。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46728f"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 27px; font-weight: 700; }
      .domain { fill: #fff; stroke: #7596a9; stroke-width: 2.2; rx: 16; }
      .logical { fill: #edf7f7; stroke: #087f8c; }
      .node { fill: #fff; stroke: #8da8b7; stroke-width: 2; rx: 11; }
      .module { fill: #eef3f7; stroke: #587b91; stroke-width: 1.7; rx: 8; }
      .label { font-size: 16px; font-weight: 650; }
      .minor { font-size: 14px; fill: #587080; }
      .group { font-size: 19px; font-weight: 700; }
      .link { fill: none; stroke: #46728f; stroke-width: 2.4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .l1 { stroke: #6c8797; stroke-dasharray: 6 5; }
      .roce { stroke: #087f8c; stroke-width: 4; }
      .linktext { font-size: 14px; font-weight: 650; fill: #315d76; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="54" y="55">A3 从节点内到跨超节点的互连层级</text>

  <rect class="domain logical" x="45" y="90" width="745" height="555"/>
  <text class="group" x="75" y="126">逻辑超节点 · HCCS-L2 域</text>

  <rect class="node" x="80" y="160" width="410" height="285"/>
  <text class="label" x="105" y="193">A3 计算节点 · 16 NPU</text>
  <g transform="translate(105 225)"><rect class="module" width="105" height="90"/><text class="label" x="52" y="34" text-anchor="middle">HiAM 0</text><text class="minor" x="52" y="59" text-anchor="middle">NPU 0–1</text><text class="minor" x="52" y="78" text-anchor="middle">SIO</text></g>
  <g transform="translate(235 225)"><rect class="module" width="105" height="90"/><text class="label" x="52" y="34" text-anchor="middle">HiAM 1</text><text class="minor" x="52" y="59" text-anchor="middle">NPU 2–3</text><text class="minor" x="52" y="78" text-anchor="middle">SIO</text></g>
  <g transform="translate(365 225)"><rect class="module" width="100" height="90"/><text class="label" x="50" y="34" text-anchor="middle">其余 HiAM</text><text class="minor" x="50" y="59" text-anchor="middle">NPU 4–15</text></g>
  <path class="link l1" d="M210 270 H234"/><path class="link l1" d="M340 270 H364"/>
  <text class="linktext" x="286" y="345" text-anchor="middle">节点内 HCCS-L1</text>
  <rect x="105" y="370" width="360" height="45" rx="8" fill="#e7eef3"/>
  <text class="minor" x="285" y="398" text-anchor="middle">设备、SIO 与节点内互连共同形成最内层故障域</text>

  <rect class="node" x="535" y="175" width="215" height="110"/>
  <text class="label" x="642" y="218" text-anchor="middle">计算节点 1</text><text class="minor" x="642" y="246" text-anchor="middle">16 NPU</text>
  <rect class="node" x="535" y="335" width="215" height="110"/>
  <text class="label" x="642" y="378" text-anchor="middle">更多计算节点</text><text class="minor" x="642" y="406" text-anchor="middle">同一逻辑域</text>
  <path class="link" d="M490 225 H534"/><path class="link" d="M490 390 H534"/>
  <path class="link" d="M642 285 V334"/>
  <text class="linktext" x="430" y="505">HCCS-L2：逻辑超节点内节点级互连</text>

  <rect class="domain" x="860" y="160" width="295" height="390"/>
  <text class="group" x="1007" y="202" text-anchor="middle">另一超节点域</text>
  <rect class="node" x="905" y="250" width="205" height="90"/>
  <text class="label" x="1007" y="290" text-anchor="middle">计算节点</text><text class="minor" x="1007" y="316" text-anchor="middle">Device 网卡</text>
  <rect class="node" x="905" y="390" width="205" height="90"/>
  <text class="label" x="1007" y="430" text-anchor="middle">计算节点</text><text class="minor" x="1007" y="456" text-anchor="middle">Device 网卡</text>
  <path class="link roce" d="M790 355 H859"/>
  <text class="linktext" x="825" y="330" text-anchor="middle">RoCE</text>
  <rect x="315" y="575" width="600" height="42" rx="8" fill="#e8f5f7"/>
  <text class="minor" x="615" y="602" text-anchor="middle">跨域链路：Device 网卡 → RoCE 网络 → 通信算法与并行组。</text>
</svg>
