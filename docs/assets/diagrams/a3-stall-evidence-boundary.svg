<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">A3 同步完成路径固定时延的证据综合</title>
  <desc id="desc">从单卡零通信 gap、主机和设备分层计时，到内部驱动等待描述、华为 host-bound profiling 与软件消融，再到卡间异质性和 BSP 规模放大。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3e718d"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #587080; }
      .box { fill: #fff; stroke: #7397aa; stroke-width: 2; rx: 12; }
      .evidence { fill: #edf6fa; stroke: #3e718d; }
      .timing { fill: #edf8f4; stroke: #27856d; }
      .risk { fill: #fff3df; stroke: #b7791f; }
      .located { fill: #f4eef8; stroke: #8055a1; }
      .label { font-size: 17px; font-weight: 650; }
      .minor { font-size: 13px; fill: #587080; }
      .tiny { font-size: 12px; fill: #587080; }
      .line { stroke: #3e718d; stroke-width: 2.3; marker-end: url(#arrow); fill: none; }
      .dash { stroke: #8055a1; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); fill: none; }
      .normal { fill: #69aeb8; }
      .stall1 { fill: #df9d47; }
      .stall2 { fill: #bc5c46; }
      .axis { stroke: #9aabb6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="660" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="48" y="50">从亚秒 gap 认识同步完成路径</text>
  <text class="subtitle" x="48" y="77">内部驱动等待描述与 host-bound 证据覆盖同一完成链，仍需同窗全栈时间线统一</text>

  <g transform="translate(44 112)">
    <rect class="box evidence" width="300" height="210"/>
    <text class="label" x="150" y="34" text-anchor="middle">单卡 · 零通信</text>
    <text class="minor" x="150" y="61" text-anchor="middle">提交固定负载并等待完成</text>
    <line class="axis" x1="30" y1="159" x2="270" y2="159"/>
    <rect class="normal" x="42" y="139" width="15" height="20" rx="2"/>
    <rect class="normal" x="62" y="137" width="15" height="22" rx="2"/>
    <rect class="normal" x="82" y="140" width="15" height="19" rx="2"/>
    <rect class="stall1" x="143" y="90" width="26" height="69" rx="3"/>
    <rect class="stall2" x="205" y="68" width="31" height="91" rx="3"/>
    <text class="tiny" x="69" y="183" text-anchor="middle">normal</text>
    <text class="tiny" x="156" y="183" text-anchor="middle">≈500 ms</text>
    <text class="tiny" x="221" y="183" text-anchor="middle">≈640–690 ms</text>
  </g>

  <path class="line" d="M344 217 H395"/>

  <g transform="translate(395 112)">
    <rect class="box timing" width="350" height="210"/>
    <text class="label" x="175" y="34" text-anchor="middle">分层计时</text>
    <g transform="translate(25 59)"><rect class="box" width="300" height="36"/><text class="minor" x="150" y="23" text-anchor="middle">enqueue：多数保持正常</text></g>
    <g transform="translate(25 105)"><rect class="box" width="300" height="36"/><text class="minor" x="150" y="23" text-anchor="middle">Host sync：部分事件长时间等待</text></g>
    <g transform="translate(25 151)"><rect class="box" width="300" height="36"/><text class="minor" x="150" y="23" text-anchor="middle">profiling：通信/同步边界，host-bound</text></g>
  </g>

  <path class="line" d="M745 217 H796"/>

  <g transform="translate(796 112)">
    <rect class="box risk" width="360" height="210"/>
    <text class="label" x="180" y="34" text-anchor="middle">BSP 同步放大</text>
    <text class="minor" x="180" y="66" text-anchor="middle">单卡 fail-slow → 通信组尾延迟</text>
    <g transform="translate(35 96)">
      <circle cx="20" cy="20" r="18" fill="#69aeb8"/><circle cx="77" cy="20" r="18" fill="#69aeb8"/><circle cx="134" cy="20" r="18" fill="#bc5c46"/><circle cx="191" cy="20" r="18" fill="#69aeb8"/><circle cx="248" cy="20" r="18" fill="#69aeb8"/>
      <path class="line" d="M20 58 H248"/>
      <text class="tiny" x="134" y="85" text-anchor="middle">所有 rank 在同步边界等待尾部</text>
    </g>
  </g>

  <g transform="translate(44 367)">
    <rect class="box" width="516" height="232"/>
    <text class="label" x="258" y="34" text-anchor="middle">异质性是模型的一部分</text>
    <text class="minor" x="258" y="64" text-anchor="middle">大量零事件卡 · 少数高频卡 · 节点聚集</text>
    <g transform="translate(34 91)">
      <rect x="0" y="70" width="32" height="28" fill="#d8e8ee"/><rect x="42" y="67" width="32" height="31" fill="#d8e8ee"/><rect x="84" y="71" width="32" height="27" fill="#d8e8ee"/><rect x="126" y="65" width="32" height="33" fill="#d8e8ee"/>
      <rect x="168" y="54" width="32" height="44" fill="#9bc7d1"/><rect x="210" y="43" width="32" height="55" fill="#9bc7d1"/><rect x="252" y="60" width="32" height="38" fill="#9bc7d1"/>
      <rect x="294" y="24" width="32" height="74" fill="#df9d47"/><rect x="336" y="4" width="32" height="94" fill="#bc5c46"/><rect x="378" y="35" width="32" height="63" fill="#df9d47"/>
      <line class="axis" x1="0" y1="99" x2="410" y2="99"/>
    </g>
  <text class="tiny" x="258" y="213" text-anchor="middle">事件率需要保留卡与节点的异质性</text>
  </g>

  <path class="line" d="M560 483 H620"/>

  <g transform="translate(620 367)">
    <rect class="box located" width="536" height="232"/>
    <text class="label" x="268" y="34" text-anchor="middle">平台机制证据</text>
    <text class="minor" x="34" y="72">• 内部描述：sync 进入驱动后的完成等待</text>
    <text class="minor" x="34" y="101">• 训练 profiling：卡上计算一致，Host 执行变慢</text>
    <text class="minor" x="34" y="130">• A/B：任务下发流水与内存分配均可缓解</text>
    <text class="minor" x="34" y="159">• 硬件压力、SNR/CRC 未见对应异常</text>
    <line class="axis" x1="34" y1="181" x2="502" y2="181"/>
    <text class="tiny" x="268" y="208" text-anchor="middle">将 API 暴露点与 CPU/runtime/内核/设备时间线对齐</text>
  </g>
</svg>
