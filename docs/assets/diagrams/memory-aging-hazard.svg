<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">存储器可靠性的概念老化曲线</title>
  <desc id="desc">生命周期模型包含早期失效、稳定使用和磨损失效三阶段，并纳入筛选、维修、负载和数据删失因素。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4f7186"/></marker>
    <linearGradient id="phase" x1="0" x2="1"><stop offset="0" stop-color="#f8ecec"/><stop offset="0.28" stop-color="#edf5f7"/><stop offset="0.72" stop-color="#edf5f7"/><stop offset="1" stop-color="#fff1df"/></linearGradient>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 27px; font-weight: 700; }
      .axis { stroke: #4f7186; stroke-width: 2.2; marker-end: url(#arrow); }
      .grid { stroke: #ccd8df; stroke-width: 1.2; stroke-dasharray: 5 6; }
      .curve { fill: none; stroke: #087f8c; stroke-width: 5; stroke-linecap: round; }
      .phase-label { font-size: 17px; font-weight: 700; }
      .minor { font-size: 14px; fill: #587080; }
      .axis-label { font-size: 15px; font-weight: 650; fill: #415f72; }
      .note { fill: #fff; stroke: #9fb3bf; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect width="1200" height="570" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="54" y="55">存储器生命周期可靠性模型</text>
  <rect x="105" y="105" width="970" height="300" rx="12" fill="url(#phase)"/>
  <line class="grid" x1="105" y1="205" x2="1075" y2="205"/><line class="grid" x1="105" y1="305" x2="1075" y2="305"/>
  <line class="axis" x1="105" y1="405" x2="1100" y2="405"/><line class="axis" x1="105" y1="405" x2="105" y2="85"/>
  <text class="axis-label" x="1090" y="437" text-anchor="end">服役年龄 / 累计应力</text>
  <text class="axis-label" x="42" y="250" transform="rotate(-90 42 250)" text-anchor="middle">条件失效率 h(t)</text>
  <path class="curve" d="M125 140 C180 245 230 310 340 326 C500 346 690 343 825 325 C930 310 985 238 1050 135"/>

  <text class="phase-label" x="220" y="125" text-anchor="middle">早期失效期</text><text class="minor" x="220" y="365" text-anchor="middle">制造、封装或装配弱点</text><text class="minor" x="220" y="386" text-anchor="middle">入场筛选与 burn-in 降低暴露</text>
  <text class="phase-label" x="590" y="125" text-anchor="middle">稳定使用期</text><text class="minor" x="590" y="365" text-anchor="middle">随机扰动与少量潜伏缺陷共同作用</text><text class="minor" x="590" y="386" text-anchor="middle">稳定期保持持续观测</text>
  <text class="phase-label" x="930" y="125" text-anchor="middle">磨损失效期</text><text class="minor" x="930" y="365" text-anchor="middle">电迁移、热循环与材料退化</text><text class="minor" x="930" y="386" text-anchor="middle">CE 复发与维修需求可能上升</text>

  <rect class="note" x="105" y="465" width="970" height="65"/>
  <text class="minor" x="590" y="491" text-anchor="middle">模型维度：服役年龄 · 累计应力 · 故障率 · 维修记录。</text>
  <text class="minor" x="590" y="515" text-anchor="middle">分组变量：硬件批次 · 温度 · 负载 · 软件版本 · 维修替换。</text>
</svg>
