<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">从观测事实到生产结论的证据推断阶梯</title>
  <desc id="desc">原始观测经测量有效性、稳定关联、机制区分、干预复验和跨条件外推逐级形成生产结论，每一级都有独立的失败条件。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#476f88"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5b7080; }
      .step { rx: 12; stroke-width: 2; }
      .s1 { fill: #eef3f7; stroke: #8099a8; }
      .s2 { fill: #e9f1fa; stroke: #497ca5; }
      .s3 { fill: #e6f4ee; stroke: #3a8970; }
      .s4 { fill: #fff1df; stroke: #b67a2d; }
      .s5 { fill: #f4eaf5; stroke: #8c5a93; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .minor { font-size: 12.5px; fill: #5b7080; }
      .arrow { stroke: #476f88; stroke-width: 2.4; marker-end: url(#arrow); }
      .guard { fill: #fff; stroke: #c0cdd5; rx: 9; }
    </style>
  </defs>
  <rect width="1280" height="720" rx="20" fill="#f8fafc" stroke="#d7e1e8"/>
  <text class="title" x="54" y="54">从观测事实到生产结论的证据推断阶梯</text>
  <text class="subtitle" x="54" y="82">每一次升级都需要新增证据；不能由图形相似或时间共现直接跨级</text>

  <rect class="step s1" x="54" y="126" width="206" height="186"/>
  <text class="label" x="157" y="164" text-anchor="middle">1 观测事实</text>
  <text class="body" x="78" y="202">事件、计数、时间线</text>
  <text class="body" x="78" y="232">吞吐、功耗、错误码</text>
  <rect class="guard" x="76" y="257" width="162" height="37"/>
  <text class="minor" x="157" y="281" text-anchor="middle">覆盖与计时边界完整</text>

  <rect class="step s2" x="296" y="180" width="206" height="186"/>
  <text class="label" x="399" y="218" text-anchor="middle">2 稳定关联</text>
  <text class="body" x="320" y="256">跨轮次、卡、节点</text>
  <text class="body" x="320" y="286">角色或负载重复出现</text>
  <rect class="guard" x="318" y="311" width="162" height="37"/>
  <text class="minor" x="399" y="335" text-anchor="middle">排除采样与选择偏差</text>

  <rect class="step s3" x="538" y="234" width="206" height="186"/>
  <text class="label" x="641" y="272" text-anchor="middle">3 机制区分</text>
  <text class="body" x="562" y="310">竞争假设产生不同预测</text>
  <text class="body" x="562" y="340">分层计时定位差异</text>
  <rect class="guard" x="560" y="365" width="162" height="37"/>
  <text class="minor" x="641" y="389" text-anchor="middle">反例与替代解释受控</text>

  <rect class="step s4" x="780" y="288" width="206" height="186"/>
  <text class="label" x="883" y="326" text-anchor="middle">4 干预复验</text>
  <text class="body" x="804" y="364">单变量 A/B 或故障注入</text>
  <text class="body" x="804" y="394">路径与结果共同变化</text>
  <rect class="guard" x="802" y="419" width="162" height="37"/>
  <text class="minor" x="883" y="443" text-anchor="middle">效应量与不确定性报告</text>

  <rect class="step s5" x="1022" y="342" width="206" height="186"/>
  <text class="label" x="1125" y="380" text-anchor="middle">5 适用结论</text>
  <text class="body" x="1046" y="418">跨版本、拓扑、负载</text>
  <text class="body" x="1046" y="448">在目标规模留出复现</text>
  <rect class="guard" x="1044" y="473" width="162" height="37"/>
  <text class="minor" x="1125" y="497" text-anchor="middle">明确适用域与失效条件</text>

  <line class="arrow" x1="260" y1="250" x2="288" y2="250"/>
  <line class="arrow" x1="502" y1="304" x2="530" y2="304"/>
  <line class="arrow" x1="744" y1="358" x2="772" y2="358"/>
  <line class="arrow" x1="986" y1="412" x2="1014" y2="412"/>

  <text class="minor" x="58" y="605">示例：同步 API 出现 600 ms gap</text>
  <text class="minor" x="315" y="630">→ 热点在相同 cohort 重现</text>
  <text class="minor" x="573" y="655">→ 完成链分层计时支持特定机制</text>
  <text class="minor" x="875" y="680">→ 干预降低事件率与训练尾部后，才讨论目标条件下的系统结论</text>
</svg>
