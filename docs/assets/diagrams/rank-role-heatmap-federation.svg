<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Rank 与并行角色热力图的联邦计算路径</title>
  <desc id="desc">每个 rank 将训练、内存和系统事实保留在本地，先按训练坐标完成本地关联，再经节点归并和角色条件统计形成多分辨率热力图；缺失和部分结果单独编码。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3e718d"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #587080; }
      .box { fill: #fff; stroke: #7397aa; stroke-width: 2; rx: 12; }
      .local { fill: #eef6fa; stroke: #3e718d; }
      .node { fill: #edf8f4; stroke: #27856d; }
      .coord { fill: #fff6e5; stroke: #b7791f; }
      .view { fill: #f4f0fb; stroke: #7651a8; }
      .label { font-size: 17px; font-weight: 650; }
      .minor { font-size: 13px; fill: #587080; }
      .line { stroke: #3e718d; stroke-width: 2.3; marker-end: url(#arrow); fill: none; }
      .thin { stroke: #9ab0bd; stroke-width: 1.3; fill: none; }
      .grid { stroke: #fff; stroke-width: 2; }
      .slow1 { fill: #d9edf3; }
      .slow2 { fill: #8fc5d2; }
      .slow3 { fill: #397f99; }
      .hot1 { fill: #fee2b8; }
      .hot2 { fill: #edaa55; }
      .hot3 { fill: #b8543c; }
      .missing { fill: #e4e8ec; }
    </style>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e4e8ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa8b2" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="52" y="52">从 rank 本地事实到角色条件热力图</text>
  <text class="subtitle" x="52" y="79">先在数据侧关联，再传输可归并状态；rank 是实例身份，role 是可比较的工作负载集合</text>

  <g transform="translate(44 116)">
    <rect class="box local" width="270" height="440"/>
    <text class="label" x="135" y="35" text-anchor="middle">Rank 本地事实</text>
    <g transform="translate(22 62)"><rect class="box" width="226" height="70"/><text class="label" x="113" y="28" text-anchor="middle">训练坐标</text><text class="minor" x="113" y="51" text-anchor="middle">step · module · role</text></g>
    <g transform="translate(22 146)"><rect class="box" width="226" height="70"/><text class="label" x="113" y="28" text-anchor="middle">性能与通信</text><text class="minor" x="113" y="51" text-anchor="middle">duration · bytes · wait</text></g>
    <g transform="translate(22 230)"><rect class="box" width="226" height="70"/><text class="label" x="113" y="28" text-anchor="middle">设备内存</text><text class="minor" x="113" y="51" text-anchor="middle">allocated · reserved · used</text></g>
    <g transform="translate(22 314)"><rect class="box" width="226" height="70"/><text class="label" x="113" y="28" text-anchor="middle">主机与进程</text><text class="minor" x="113" y="51" text-anchor="middle">CPU · RSS · context switch</text></g>
    <text class="minor" x="135" y="418" text-anchor="middle">本地 JOIN · 区间并集 · Top-K</text>
  </g>

  <path class="line" d="M314 337 H374"/>

  <g transform="translate(374 155)">
    <rect class="box node" width="245" height="360"/>
    <text class="label" x="122" y="36" text-anchor="middle">节点归并</text>
    <text class="minor" x="122" y="63" text-anchor="middle">local0 汇集本机 leaf</text>
    <line class="thin" x1="26" y1="87" x2="219" y2="87"/>
    <text class="label" x="122" y="122" text-anchor="middle">可归并状态</text>
    <text class="minor" x="122" y="151" text-anchor="middle">count · sum · min · max</text>
    <text class="minor" x="122" y="176" text-anchor="middle">quantile sketch · Top-K</text>
    <text class="minor" x="122" y="201" text-anchor="middle">rank coverage · tile</text>
    <line class="thin" x1="26" y1="224" x2="219" y2="224"/>
    <text class="label" x="122" y="260" text-anchor="middle">拓扑上下文</text>
    <text class="minor" x="122" y="289" text-anchor="middle">node · device · rail</text>
    <text class="minor" x="122" y="314" text-anchor="middle">失败分片与丢弃计数</text>
  </g>

  <path class="line" d="M619 337 H679"/>

  <g transform="translate(679 155)">
    <rect class="box coord" width="230" height="360"/>
    <text class="label" x="115" y="36" text-anchor="middle">协调层</text>
    <text class="minor" x="115" y="63" text-anchor="middle">冻结成员快照</text>
    <line class="thin" x1="24" y1="87" x2="206" y2="87"/>
    <text class="label" x="115" y="122" text-anchor="middle">角色条件统计</text>
    <text class="minor" x="115" y="151" text-anchor="middle">TP/PP/DP/EP/CP cohort</text>
    <text class="minor" x="115" y="176" text-anchor="middle">median · MAD · quantile</text>
    <text class="minor" x="115" y="201" text-anchor="middle">subject / reference</text>
    <line class="thin" x1="24" y1="224" x2="206" y2="224"/>
    <text class="label" x="115" y="260" text-anchor="middle">质量收据</text>
    <text class="minor" x="115" y="289" text-anchor="middle">expected / seen</text>
    <text class="minor" x="115" y="314" text-anchor="middle">partial · error bound</text>
  </g>

  <path class="line" d="M909 337 H955"/>

  <g transform="translate(955 112)">
    <rect class="box view" width="201" height="448"/>
    <text class="label" x="100" y="35" text-anchor="middle">多分辨率视图</text>
    <text class="minor" x="100" y="61" text-anchor="middle">step × rank</text>
    <g transform="translate(24 82)">
      <rect class="grid slow1" x="0" y="0" width="36" height="30"/><rect class="grid slow2" x="38" y="0" width="36" height="30"/><rect class="grid slow1" x="76" y="0" width="36" height="30"/><rect class="grid hot2" x="114" y="0" width="36" height="30"/>
      <rect class="grid slow1" x="0" y="32" width="36" height="30"/><rect class="grid slow2" x="38" y="32" width="36" height="30"/><rect class="grid hot1" x="76" y="32" width="36" height="30"/><rect class="grid hot3" x="114" y="32" width="36" height="30"/>
      <rect class="grid slow2" x="0" y="64" width="36" height="30"/><rect class="grid slow1" x="38" y="64" width="36" height="30"/><rect class="grid hot2" x="76" y="64" width="36" height="30"/><rect x="114" y="64" width="36" height="30" fill="url(#hatch)" class="grid"/>
      <rect class="grid slow1" x="0" y="96" width="36" height="30"/><rect class="grid slow2" x="38" y="96" width="36" height="30"/><rect class="grid slow3" x="76" y="96" width="36" height="30"/><rect class="grid hot2" x="114" y="96" width="36" height="30"/>
    </g>
    <text class="minor" x="100" y="235" text-anchor="middle">绝对值 · 角色内偏差</text>
    <text class="minor" x="100" y="260" text-anchor="middle">module × rank 内存</text>
    <text class="minor" x="100" y="285" text-anchor="middle">time × rank 系统状态</text>
    <text class="minor" x="100" y="310" text-anchor="middle">collective × rank 等待</text>
    <line class="thin" x1="24" y1="332" x2="177" y2="332"/>
    <rect x="24" y="353" width="18" height="18" fill="url(#hatch)"/>
    <text class="minor" x="52" y="367">缺失 ≠ 0</text>
    <text class="minor" x="100" y="404" text-anchor="middle">缩放：job → node → role → rank</text>
  </g>

  <g transform="translate(44 594)">
    <rect class="box" width="1112" height="82"/>
    <text class="label" x="26" y="32">解释顺序</text>
    <text class="minor" x="26" y="59">角色内异常 → 时间持续性 → 内存/CPU/GPU 共变 → 拓扑聚集 → 选择少量 rank 与窄窗口进入火焰图和精确 Timeline</text>
  </g>
</svg>
