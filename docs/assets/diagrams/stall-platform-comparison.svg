<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">A3 与 C550 单卡停顿形态对照</title>
  <desc id="desc">两个平台使用相同的零通信单卡探针和二百毫秒阈值。A3 事件更高频、更长并呈现卡级热点，训练分析展示 host-bound 与软件消融敏感性；C550 更低频、更短且呈节点级线索，机制说明展示 dispatch 与 wait-signal 路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3e718d"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #587080; }
      .box { fill: #fff; stroke: #7397aa; stroke-width: 2; rx: 12; }
      .probe { fill: #edf6fa; stroke: #3e718d; }
      .a3 { fill: #fff1e1; stroke: #b7791f; }
      .c550 { fill: #eaf7f2; stroke: #27856d; }
      .outside { fill: #f4eef8; stroke: #8055a1; stroke-dasharray: 7 5; }
      .label { font-size: 18px; font-weight: 650; }
      .minor { font-size: 13px; fill: #587080; }
      .tiny { font-size: 12px; fill: #587080; }
      .line { stroke: #3e718d; stroke-width: 2.3; marker-end: url(#arrow); fill: none; }
      .dash { stroke: #8055a1; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); fill: none; }
      .axis { stroke: #9aabb6; stroke-width: 1.5; }
      .a3bar { fill: #c96a45; }
      .cbar { fill: #479783; }
    </style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="#f8fafc" stroke="#d8e2ea"/>
  <text class="title" x="48" y="50">相同观测口径，不同事件形态</text>
  <text class="subtitle" x="48" y="77">固定单卡负载 · 零通信 · 主机墙钟 gap ≥ 200 ms</text>

  <g transform="translate(387 105)">
    <rect class="box probe" width="426" height="95"/>
    <text class="label" x="213" y="34" text-anchor="middle">共同探针边界</text>
    <text class="minor" x="213" y="62" text-anchor="middle">submit → runtime/driver → device → synchronize return</text>
    <text class="tiny" x="213" y="82" text-anchor="middle">观测端到端延迟，再用分层计时还原完成链</text>
  </g>

  <path class="line" d="M498 200 L330 249"/>
  <path class="line" d="M702 200 L870 249"/>

  <g transform="translate(44 245)">
    <rect class="box a3" width="500" height="280"/>
    <text class="label" x="250" y="36" text-anchor="middle">A3</text>
    <text class="minor" x="250" y="65" text-anchor="middle">0.393 次/卡/分钟 · 主测</text>
    <line class="axis" x1="43" y1="170" x2="457" y2="170"/>
    <rect class="a3bar" x="175" y="105" width="52" height="65" rx="3"/>
    <rect class="a3bar" x="284" y="73" width="68" height="97" rx="3"/>
    <text class="tiny" x="201" y="192" text-anchor="middle">≈500 ms</text>
    <text class="tiny" x="318" y="192" text-anchor="middle">≈640–690 ms</text>
    <text class="minor" x="250" y="224" text-anchor="middle">最大约 822 ms</text>
    <text class="minor" x="250" y="252" text-anchor="middle">少数物理卡与节点贡献大部分事件</text>
    <text class="tiny" x="250" y="273" text-anchor="middle">机制证据：host-bound · 任务下发/分配器敏感</text>
  </g>

  <g transform="translate(656 245)">
    <rect class="box c550" width="500" height="280"/>
    <text class="label" x="250" y="36" text-anchor="middle">C550</text>
    <text class="minor" x="250" y="65" text-anchor="middle">0.0104 次/卡/分钟 · 主测</text>
    <line class="axis" x1="43" y1="170" x2="457" y2="170"/>
    <rect class="cbar" x="86" y="94" width="58" height="76" rx="3"/>
    <rect class="cbar" x="149" y="112" width="44" height="58" rx="3"/>
    <rect class="cbar" x="198" y="136" width="29" height="34" rx="3"/>
    <rect class="cbar" x="232" y="151" width="18" height="19" rx="3"/>
    <text class="tiny" x="168" y="192" text-anchor="middle">200–272 ms（左截断）</text>
    <text class="minor" x="250" y="224" text-anchor="middle">主测无 ≥300 ms；只构成有限曝光上界</text>
    <text class="minor" x="250" y="252" text-anchor="middle">热点节点近似稳定，节点内设备序号变化</text>
    <text class="tiny" x="250" y="273" text-anchor="middle">机制说明：dispatch · CPU 负载 · wait-signal</text>
  </g>

  <path class="dash" d="M906 525 L906 556"/>
  <g transform="translate(552 556)">
    <rect class="box outside" width="604" height="64"/>
    <text class="label" x="302" y="27" text-anchor="middle">另一集群的 C550 collective 秒级尾部</text>
    <text class="tiny" x="302" y="49" text-anchor="middle">用网络、MCCL、QoS 与多租户同窗证据继续分解</text>
  </g>
  <g transform="translate(44 556)">
    <rect class="box" width="462" height="64"/>
    <text class="label" x="231" y="27" text-anchor="middle">共同结论</text>
    <text class="tiny" x="231" y="49" text-anchor="middle">峰值性能、利用率与长窗 forward progress 回答不同问题</text>
  </g>
</svg>
