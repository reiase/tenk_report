<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">训练资源健康证据的系统模型</title>
  <desc id="desc">硬件、软件、环境与工作负载条件经正确性、能力和前向进展三个证据面观测，再结合并行组和拓扑形成训练资源决策。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#476f88"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173247; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5b7080; }
      .box { rx: 14; stroke-width: 2; }
      .condition { fill: #eef3f7; stroke: #8aa1b0; }
      .correct { fill: #e6f4ee; stroke: #3a8970; }
      .capability { fill: #e9f1fa; stroke: #497ca5; }
      .progress { fill: #fff1df; stroke: #b67a2d; }
      .amp { fill: #f4eaf5; stroke: #8c5a93; }
      .decision { fill: #e4f3f4; stroke: #277f88; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 14px; }
      .minor { font-size: 13px; fill: #5b7080; }
      .arrow { stroke: #476f88; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
      .note { fill: #fff; stroke: #c0cdd5; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect width="1280" height="720" rx="20" fill="#f8fafc" stroke="#d7e1e8"/>
  <text class="title" x="56" y="55">训练资源健康证据的系统模型</text>
  <text class="subtitle" x="56" y="82">健康不是单值属性；结论必须绑定条件、故障域与目标训练拓扑</text>

  <rect class="box condition" x="54" y="126" width="230" height="402"/>
  <text class="label" x="169" y="164" text-anchor="middle">条件空间</text>
  <text class="body" x="82" y="210">硬件批次与位置</text>
  <text class="body" x="82" y="252">固件、驱动与运行时</text>
  <text class="body" x="82" y="294">功率、温度与冷却</text>
  <text class="body" x="82" y="336">负载形状与数据模式</text>
  <text class="body" x="82" y="378">拓扑、并行角色与规模</text>
  <text class="body" x="82" y="420">观察时长与采样方法</text>
  <rect class="note" x="76" y="456" width="186" height="48"/>
  <text class="minor" x="169" y="477" text-anchor="middle">条件变化意味着</text>
  <text class="minor" x="169" y="496" text-anchor="middle">新的比较 cohort</text>

  <rect class="box correct" x="364" y="126" width="226" height="150"/>
  <text class="label" x="477" y="163" text-anchor="middle">正确性</text>
  <text class="body" x="390" y="199">数值参考与不变量</text>
  <text class="body" x="390" y="229">SDC、NaN/Inf、ECC</text>
  <text class="minor" x="390" y="255">结果是否可信</text>

  <rect class="box capability" x="364" y="300" width="226" height="150"/>
  <text class="label" x="477" y="337" text-anchor="middle">能力</text>
  <text class="body" x="390" y="373">矩阵吞吐与 HBM 带宽</text>
  <text class="body" x="390" y="403">功耗、温度与稳态</text>
  <text class="minor" x="390" y="429">服务率是否达到基线</text>

  <rect class="box progress" x="364" y="474" width="226" height="150"/>
  <text class="label" x="477" y="511" text-anchor="middle">前向进展</text>
  <text class="body" x="390" y="547">提交、完成与消费</text>
  <text class="body" x="390" y="577">gap、wait 与 step 尾部</text>
  <text class="minor" x="390" y="603">工作是否持续退休</text>

  <path class="arrow" d="M284 218 H356"/>
  <path class="arrow" d="M284 327 H356"/>
  <path class="arrow" d="M284 436 C322 436 326 548 356 548"/>

  <rect class="box amp" x="674" y="190" width="250" height="360"/>
  <text class="label" x="799" y="229" text-anchor="middle">系统传播</text>
  <text class="body" x="702" y="272">并行组同步边界</text>
  <text class="body" x="702" y="312">rank 到拓扑映射</text>
  <text class="body" x="702" y="352">事件频率与持续时间</text>
  <text class="body" x="702" y="392">计算—通信掩盖窗口</text>
  <text class="body" x="702" y="432">训练时长与完成机会</text>
  <rect class="note" x="700" y="470" width="198" height="54"/>
  <text class="minor" x="799" y="493" text-anchor="middle">局部异常经关键路径</text>
  <text class="minor" x="799" y="513" text-anchor="middle">转化为集群影响</text>

  <path class="arrow" d="M590 201 H666"/>
  <path class="arrow" d="M590 375 H666"/>
  <path class="arrow" d="M590 549 H666"/>

  <rect class="box decision" x="1006" y="190" width="220" height="360"/>
  <text class="label" x="1116" y="229" text-anchor="middle">系统决策</text>
  <text class="body" x="1034" y="274">资源准入与候选排序</text>
  <text class="body" x="1034" y="316">拓扑放置与并行映射</text>
  <text class="body" x="1034" y="358">实验复验与证据升级</text>
  <text class="body" x="1034" y="400">隔离、恢复与再准入</text>
  <text class="body" x="1034" y="442">训练配置与同步策略</text>
  <rect class="note" x="1032" y="470" width="168" height="54"/>
  <text class="minor" x="1116" y="493" text-anchor="middle">保留证据向量</text>
  <text class="minor" x="1116" y="513" text-anchor="middle">不压缩为单一分数</text>

  <path class="arrow" d="M924 370 H998"/>
  <path class="arrow dash" d="M1116 558 C1116 676 477 687 477 632"/>
</svg>
